<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runeterra Günlükleri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06080f; --bg2: #090d18; --card: #0b1020; --border: #1a2035;
      --gold: #c8972a; --gold2: #e8c060; --blue: #4a9eff; --text: #d4c9b8; --muted: #6a7080;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Crimson Pro', serif; font-size: 18px; line-height: 1.8; overflow-x: hidden; margin: 0; }

    #scroll-lock { position: fixed; inset: 0; z-index: 999999; animation: removeLock 0s linear 4.5s forwards; }
    @keyframes removeLock { to { visibility: hidden; pointer-events: none; } }

    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 20% 0%, rgba(74,158,255,0.05) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(200,151,42,0.07) 0%, transparent 60%); pointer-events: none; z-index: 0; }

    /* NAV MENÜSÜ */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 20px 56px; background: rgba(6,8,15,0.92); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(200,151,42,0.15); opacity: 0; animation: navFadeDown 0.8s ease-out 4.2s forwards; }
    @keyframes navFadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    .logo { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 900; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; }
    nav ul { display: flex; gap: 36px; list-style: none; }
    nav a { font-family: 'Cinzel', serif; font-size: 11px; color: var(--muted); text-decoration: none; letter-spacing: 0.15em; text-transform: uppercase; transition: color 0.25s; }
    nav a:hover { color: var(--gold); }

    /* GİRİŞ EKRANI */
    #hero { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 120px 40px 80px; }
    .rune-divider { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
    .rune-icon { color: var(--gold); animation: introStar 4s linear forwards; }
    @keyframes introStar {
      0% { transform: scale(12); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .rune-line { width: 80px; height: 1px; background: var(--gold); opacity: 0; animation: expandLine 0.6s ease-out 3.2s forwards; }
    @keyframes expandLine { from { width: 0; opacity: 0; } to { width: 80px; opacity: 1; } }

    .hero-sub { font-family: 'Cinzel', serif; font-size: 14px; color: var(--gold); letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 32px; opacity: 0; animation: textFadeUp 0.8s ease-out 3.3s forwards; }
    h1 { font-family: 'Cinzel', serif; font-size: clamp(42px, 7vw, 88px); font-weight: 900; color: #fff; margin-bottom: 8px; opacity: 0; animation: textFadeUp 0.8s ease-out 3.5s forwards; }
    @keyframes textFadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    /* SES KONTROL BUTONLARI */
    .controls-wrapper { position: fixed; bottom: 30px; right: 30px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .audio-btn { background: rgba(6, 8, 15, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(200, 151, 42, 0.3); color: var(--gold); font-family: 'Cinzel', serif; font-size: 10px; padding: 10px 20px; border-radius: 50px; cursor: pointer; text-transform: uppercase; transition: all 0.3s; opacity: 0; animation: textFadeUp 0.8s ease-out 4.5s forwards; }
    .audio-btn.active { border-color: var(--gold2); color: #fff; }

    /* HİKAYE KARTLARI */
    .section-wrap { max-width: 1080px; margin: 0 auto; padding: 0 48px; }
    .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; padding-top: 40px; }
    .story-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.4s; }
    .story-card:hover { transform: translateY(-8px); border-color: var(--gold); }
    .card-body { padding: 28px; }
    .card-region { color: var(--gold); font-family: 'Cinzel', serif; font-size: 10px; border: 1px solid rgba(200,151,42,0.3); padding: 4px 10px; }
    .title-name { font-family: 'Cinzel', serif; font-size: 18px; color: #fff; margin: 15px 0 10px; }
    .card-excerpt { font-size: 15px; color: var(--muted); font-style: italic; }

    /* SİNEMATİK GEÇİŞ SİSTEMİ (TEMİZLENMİŞ) */
    #page-transition-overlay { position: fixed; inset: 0; z-index: 9999999; pointer-events: none; visibility: hidden; }
    #page-transition-overlay.active { visibility: visible; pointer-events: all; }
    .transition-splash { position: absolute; inset: 0; background-position: center top; background-size: cover; opacity: 0; transform: scale(1.1); transition: opacity 0.8s ease-out, transform 2s ease-out; }
    #page-transition-overlay.active .transition-splash { opacity: 1; transform: scale(1); }
    .transition-blackout { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity 0.8s ease-in-out; }
    #page-transition-overlay.active.blackout .transition-blackout { opacity: 1; }

    .fade-in { opacity: 0; transform: translateY(35px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div style="display: none;"><div id="youtube-player"></div></div>
  <audio id="hover-sound" preload="auto"><source src="lol-hover.mp3" type="audio/mpeg"></audio>

  <div class="controls-wrapper">
    <button id="music-toggle" class="audio-btn">🔇 Müzik</button>
    <button id="sfx-toggle" class="audio-btn active">🔊 Efektler</button>
  </div>

  <div id="scroll-lock"></div>
  <div id="page-transition-overlay">
    <div class="transition-splash" id="transition-splash"></div>
    <div class="transition-blackout" id="transition-blackout"></div>
  </div>

  <nav>
    <div class="logo">Runeterra <span>Günlükleri</span></div>
    <ul>
      <li><a href="#hikayeler">Efsaneler</a></li>
    </ul>
  </nav>

  <section id="hero">
    <div class="rune-divider"><span class="rune-line"></span><span class="rune-icon">✦</span><span class="rune-line"></span></div>
    <p class="hero-sub">Arşiv Açıldı</p>
    <h1>Efsaneler<br>Burada</h1>
    <a href="#hikayeler" style="text-decoration:none; color:var(--gold); margin-top:30px; border:1px solid; padding:10px 30px;">KEŞFET</a>
  </section>

  <section id="hikayeler">
    <div class="section-wrap">
      <div class="stories-grid" id="main-grid"></div>
    </div>
  </section>

  <script>
    const championsData = [
      { id: "Volibear", name: "Volibear", region: "Freljord", excerpt: "Kuzeyin dondurucu fırtınası geri dönüyor." },
      { id: "Garen", name: "Garen", region: "Demacia", excerpt: "Demacia'nın kudreti sarsılmaz bir iradeyle korunur." },
      { id: "Darius", name: "Darius", region: "Noxus", excerpt: "Güç, sadece onu kullanmaya cesareti olanlarındır." },
      { id: "Yasuo", name: "Yasuo", region: "Ionia", excerpt: "Ölüm bir fısıltı gibi, kılıcım ise rüzgar." }
    ];

    const grid = document.getElementById('main-grid');
    const overlay = document.getElementById('page-transition-overlay');
    const splash = document.getElementById('transition-splash');

    // Sinematik Geçiş: Sesler ve şimşek efektleri kaldırıldı.
    function triggerTransition(id) {
      const pageLink = id.toLowerCase() + '.html';
      splash.style.backgroundImage = `url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${id}_0.jpg')`;
      overlay.classList.add('active');

      setTimeout(() => {
        overlay.classList.add('blackout');
        setTimeout(() => { window.location.href = pageLink; }, 800);
      }, 1200);
    }

    championsData.forEach(champ => {
      const card = document.createElement('div');
      card.className = 'story-card fade-in';
      card.innerHTML = `
        <div class="card-body">
          <span class="card-region">${champ.region}</span>
          <div class="title-name">${champ.name}</div>
          <p class="card-excerpt">${champ.excerpt}</p>
        </div>
      `;
      card.onclick = () => triggerTransition(champ.id);
      grid.appendChild(card);
    });

    // Observer for fade-in
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
    });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // Ses Kontrolleri
    let ytPlayer, isMusicPlaying = false, isSfxEnabled = true;
    const musicBtn = document.getElementById('music-toggle'), sfxBtn = document.getElementById('sfx-toggle');

    const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = () => {
      ytPlayer = new YT.Player('youtube-player', { height: '0', width: '0', videoId: 'aPf9EcHbWHE' });
    };

    musicBtn.onclick = () => {
      if(!isMusicPlaying) { ytPlayer.playVideo(); musicBtn.classList.add('active'); musicBtn.innerText = "🔊 Müzik"; }
      else { ytPlayer.pauseVideo(); musicBtn.classList.remove('active'); musicBtn.innerText = "🔇 Müzik"; }
      isMusicPlaying = !isMusicPlaying;
    };

    sfxBtn.onclick = () => {
      isSfxEnabled = !isSfxEnabled;
      sfxBtn.classList.toggle('active');
      sfxBtn.innerText = isSfxEnabled ? "🔊 Efektler" : "🔇 Efektler";
    };
  </script>
</body>
</html>
