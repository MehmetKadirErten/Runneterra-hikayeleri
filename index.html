<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runeterra Günlükleri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #06080f; --bg2: #090d18; --card: #0b1020; --border: #1a2035;
      --gold: #c8972a; --gold2: #e8c060; --text: #d4c9b8; --muted: #6a7080;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Crimson Pro', serif; font-size: 18px; line-height: 1.8; overflow-x: hidden; margin: 0; }

    /* AMBİYANS */
    @keyframes ambientGlow { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 20% 0%, rgba(74,158,255,0.05) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(200,151,42,0.07) 0%, transparent 60%); pointer-events: none; z-index: 0; animation: ambientGlow 10s ease-in-out infinite; }

    /* NAV MENÜSÜ */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 20px 56px; background: rgba(6,8,15,0.92); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(200,151,42,0.15); }
    .logo { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 900; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; }
    .logo span { color: var(--text); font-weight: 400; }
    nav ul { display: flex; gap: 36px; list-style: none; }
    nav a { font-family: 'Cinzel', serif; font-size: 11px; color: var(--muted); text-decoration: none; letter-spacing: 0.15em; text-transform: uppercase; }

    /* HERO */
    #hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 120px 40px 80px; }
    h1 { font-family: 'Cinzel', serif; font-size: clamp(42px, 7vw, 88px); font-weight: 900; color: #fff; margin-bottom: 30px; }
    .hero-cta { padding: 14px 36px; border: 1px solid rgba(200,151,42,0.5); color: var(--gold); text-decoration: none; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }

    /* KONTROLLER */
    .controls-wrapper { position: fixed; bottom: 30px; right: 30px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .audio-btn { background: rgba(6, 8, 15, 0.85); border: 1px solid rgba(200, 151, 42, 0.3); color: var(--gold); padding: 10px 20px; border-radius: 50px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 10px; }
    .audio-btn.active { border-color: var(--gold2); color: #fff; }

    /* GRID VE KARTLAR */
    .section-wrap { max-width: 1080px; margin: 0 auto; padding: 48px; }
    .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .story-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.3s; position: relative; }
    .story-card:hover { transform: translateY(-5px); border-color: var(--gold); }
    .card-body { padding: 25px; }
    .card-title-container { font-family: 'Cinzel', serif; font-size: 18px; color: #fff; margin-bottom: 10px; }
    .card-excerpt { font-size: 14px; color: var(--muted); font-style: italic; }

    /* =========================================
       ÖZEL VOLIBEAR SİNEMATİK SİSTEMİ
       ========================================= */
    #boss-overlay {
      position: fixed; inset: 0; z-index: 9999999;
      background: #000; visibility: hidden; opacity: 0;
      display: flex; justify-content: center; align-items: center;
      transition: opacity 0.5s;
    }
    #boss-overlay.active { visibility: visible; opacity: 1; }
    
    /* Volibear'in Yıldırım Çakan Silüeti */
    .volibear-figure {
      width: 100%; height: 100%;
      background-position: center top; background-size: cover;
      opacity: 0;
      /* Siyah beyaz ve aşırı parlak (Silüet efekti) */
      filter: grayscale(1) brightness(100) contrast(1000%); 
    }
    /* Yıldırım Çakma Anı */
    .volibear-figure.flash { opacity: 1; }

    .fade-in { opacity: 0; transform: translateY(20px); transition: 0.6s all; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div id="youtube-player" style="position:fixed; visibility:hidden;"></div>
  <audio id="hover-sound"><source src="lol-hover.mp3" type="audio/mpeg"></audio>
  <audio id="volibear-voice"><source src="volibear-voice.mp3" type="audio/mpeg"></audio>
  <audio id="lightning-sfx"><source src="lightning.mp3" type="audio/mpeg"></audio>

  <div class="controls-wrapper">
    <button id="music-toggle" class="audio-btn"><span>🔇</span> Müzik</button>
    <button id="sfx-toggle" class="audio-btn active"><span>🔊</span> Efektler</button>
  </div>

  <div id="boss-overlay">
    <div class="volibear-figure" id="volibear-figure"></div>
  </div>

  <nav>
    <div class="logo">Runeterra <span>Günlükleri</span></div>
    <ul><li><a href="#hikayeler">Efsaneler</a></li><li><a href="#hakkinda">Hakkında</a></li></ul>
  </nav>

  <section id="hero">
    <h1>Efsaneler Yaşıyor</h1>
    <a href="#hikayeler" class="hero-cta">Keşfet</a>
  </section>

  <section id="hikayeler" class="section-wrap">
    <div class="stories-grid" id="main-grid"></div>
  </section>

  <script>
    /* 1. ŞAMPİYON VERİSİ VE RENDER */
    const championsData = [
      { id: "Volibear", name: "Volibear", regionClass: "freljord", excerpt: "Kuzeyin dondurucu rüzgarları sadece soğuk getirmiyordu..." },
      { id: "Garen", name: "Garen", regionClass: "demacia", excerpt: "Demacia'nın görkemli surları her zaman ayakta kalacak." },
      { id: "Darius", name: "Darius", regionClass: "noxus", excerpt: "Noxus'un gücü sarsılmaz bir iradeden gelir." }
    ];

    const grid = document.getElementById('main-grid');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(el => { if (el.isIntersecting) el.target.classList.add('visible'); });
    }, { threshold: 0.1 });

    function render() {
      grid.innerHTML = '';
      championsData.forEach(champ => {
        const card = document.createElement('div');
        card.className = `story-card fade-in`;
        card.innerHTML = `
          <div class="card-body">
            <div class="card-title-container">${champ.name}</div>
            <p class="card-excerpt">${champ.excerpt}</p>
          </div>`;
        
        card.addEventListener('click', () => handleTransition(champ.id));
        card.addEventListener('mouseenter', () => playHover());
        
        grid.appendChild(card);
        observer.observe(card);
      });
    }
    render();

    /* 2. SİNEMATİK GEÇİŞ MANTIĞI */
    function handleTransition(id) {
      if (id === 'Volibear') {
        const overlay = document.getElementById('boss-overlay');
        const figure = document.getElementById('volibear-figure');
        const voice = document.getElementById('volibear-voice');
        const lightning = document.getElementById('lightning-sfx');

        // Volibear Silüet Resmini hazırla
        figure.style.backgroundImage = `url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Volibear_0.jpg')`;
        overlay.classList.add('active');

        // 1. Replik başlar
        voice.volume = 0.5; voice.play();

        // 2. İLK YILDIRIM (Hemen başlar veya 0.5s sonra)
        setTimeout(() => {
          if(isSfxEnabled) { lightning.currentTime = 0; lightning.play(); }
          figure.classList.add('flash'); // Siyah beyaz figür gözükür
          
          // Ses bittikten sonra figür kaybolur
          lightning.onended = () => {
            figure.classList.remove('flash');
            
            // 3. SES BİTTİKTEN 1 SANİYE SONRA TEKRAR
            setTimeout(() => {
              if(isSfxEnabled) { lightning.currentTime = 0; lightning.play(); }
              figure.classList.add('flash'); // Figür tekrar gözükür
              
              // İkinci ses bittikten sonra her şeyi kapat ve geç
              lightning.onended = () => {
                figure.classList.remove('flash');
                setTimeout(() => window.location.href = 'volibear.html', 500);
              };
            }, 1000);
          };
        }, 500);

      } else {
        window.location.href = id.toLowerCase() + '.html';
      }
    }

    /* 3. SES SİSTEMİ */
    let ytPlayer, isMusicPlaying = false, isSfxEnabled = true;
    const hoverSound = document.getElementById('hover-sound');
    
    function playHover() {
      if (isSfxEnabled) {
        hoverSound.pause();
        hoverSound.currentTime = 2.5; // 2.5 saniyeden başlar
        hoverSound.play().catch(()=>{});
      }
    }
    
    hoverSound.addEventListener('timeupdate', function() {
      if (this.currentTime >= 9.0) this.pause(); // 9.0 saniyede durur
    });

    // YouTube Müzik (Sesi %10 yaptık)
    const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('youtube-player', {
        height: '0', width: '0', videoId: 'aPf9EcHbWHE',
        playerVars: { 'autoplay': 0, 'controls': 0, 'start': 2 },
        events: { 'onReady': (e) => e.target.setVolume(10) }
      });
    };

    document.getElementById('music-toggle').onclick = function() {
      if (!ytPlayer) return;
      if (!isMusicPlaying) {
        ytPlayer.playVideo(); this.classList.add('active'); this.innerHTML = '🔊 Müzik'; isMusicPlaying = true;
      } else {
        ytPlayer.pauseVideo(); this.classList.remove('active'); this.innerHTML = '🔇 Müzik'; isMusicPlaying = false;
      }
    };

    document.getElementById('sfx-toggle').onclick = function() {
      isSfxEnabled = !isSfxEnabled;
      this.classList.toggle('active');
      this.innerHTML = isSfxEnabled ? '🔊 Efektler' : '🔇 Efektler';
    };
  </script>
</body>
</html>
