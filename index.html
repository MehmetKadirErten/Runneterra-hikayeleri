<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runeterra Günlükleri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06080f; --bg2: #090d18; --card: #0b1020; --border: #1a2035;
      --gold: #c8972a; --gold2: #e8c060; --blue: #4a9eff; --text: #d4c9b8; --muted: #6a7080;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Crimson Pro', serif; font-size: 18px; line-height: 1.8; overflow-x: hidden; margin: 0; }

    #scroll-lock { position: fixed; inset: 0; z-index: 999999; animation: removeLock 0s linear 4.5s forwards; }
    @keyframes removeLock { to { visibility: hidden; pointer-events: none; } }

    @keyframes ambientGlow { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 20% 0%, rgba(74,158,255,0.05) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(200,151,42,0.07) 0%, transparent 60%); pointer-events: none; z-index: 0; animation: ambientGlow 10s ease-in-out infinite; }

    /* NAV MENÜSÜ */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 20px 56px; background: rgba(6,8,15,0.92); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(200,151,42,0.15); opacity: 0; animation: navFadeDown 0.8s ease-out 4.2s forwards; }
    @keyframes navFadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    .logo { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 900; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; transition: text-shadow 0.3s; }
    .logo:hover { text-shadow: 0 0 15px rgba(200,151,42,0.5); }
    .logo span { color: var(--text); font-weight: 400; }
    nav ul { display: flex; gap: 36px; list-style: none; }
    nav a { font-family: 'Cinzel', serif; font-size: 11px; color: var(--muted); text-decoration: none; letter-spacing: 0.15em; text-transform: uppercase; transition: color 0.25s, text-shadow 0.25s; }
    nav a:hover { color: var(--gold); text-shadow: 0 0 10px rgba(200,151,42,0.4); }

    /* YILDIZ GİRİŞİ */
    #hero { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 120px 40px 80px; }
    .rune-divider { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; font-size: 18px; }
    .rune-icon { display: inline-block; color: var(--gold); will-change: transform, opacity, filter, text-shadow; animation: introStar 4s linear forwards, pulseRune 3s infinite ease-in-out 4s; }
    @keyframes introStar {
      0%   { transform: translate(0vw, 25vh) scale(12) rotate(0deg); opacity: 0; filter: blur(0px) brightness(1); text-shadow: 0 0 10px var(--gold); }
      5%   { transform: translate(0vw, 25vh) scale(13) rotate(0deg); opacity: 1; filter: blur(0px) brightness(1.2); text-shadow: 0 0 30px var(--gold2); }
      15%  { transform: translate(0vw, 25vh) scale(14) rotate(0deg); opacity: 1; filter: blur(0px) brightness(1.5); text-shadow: 0 0 60px var(--gold2); }
      20%  { transform: translate(8vw, 24vh) scale(12) rotate(45deg); filter: blur(1px) brightness(1.5); }
      25%  { transform: translate(16vw, 22vh) scale(10) rotate(90deg); filter: blur(2px) brightness(1.5); }
      30%  { transform: translate(23vw, 19vh) scale(8) rotate(135deg); filter: blur(3px) brightness(1.5); }
      35%  { transform: translate(29vw, 15vh) scale(6) rotate(180deg); }
      40%  { transform: translate(33vw, 11vh) scale(4.5) rotate(225deg); }
      45%  { transform: translate(35vw, 7vh) scale(3.5) rotate(270deg); filter: blur(3px) brightness(1.5); text-shadow: 0 0 20px var(--gold2); }
      50%  { transform: translate(34vw, 3.5vh) scale(2.5) rotate(315deg); filter: blur(2px); }
      55%  { transform: translate(31vw, 1vh) scale(2.0) rotate(360deg); filter: blur(1px); }
      60%  { transform: translate(26vw, -0.5vh) scale(1.6) rotate(405deg); filter: blur(0.5px); }
      65%  { transform: translate(19vw, -1.5vh) scale(1.3) rotate(450deg); filter: blur(0px); }
      70%  { transform: translate(10vw, -1.5vh) scale(1.1) rotate(495deg); }
      75%  { transform: translate(0vw, 0vh) scale(1) rotate(540deg); opacity: 1; color: var(--gold); text-shadow: 0 0 5px var(--gold); filter: brightness(1); }
      80%  { transform: translate(0vw, 0vh) scale(2.8) rotate(540deg); color: #fff; text-shadow: 0 0 60px #fff, 0 0 120px var(--gold2); filter: brightness(2); }
      100% { transform: translate(0vw, 0vh) scale(1) rotate(540deg); opacity: 1; color: var(--gold); text-shadow: 0 0 5px var(--gold); filter: brightness(1); }
    }
    @keyframes pulseRune { 0%, 100% { text-shadow: 0 0 5px var(--gold); transform: scale(1); } 50% { text-shadow: 0 0 20px var(--gold2); transform: scale(1.2); } }
    .rune-line { display: block; width: 0px; height: 1px; opacity: 0; animation: expandLine 0.6s cubic-bezier(0.2, 1, 0.2, 1) 3.2s forwards; }
    .rune-line.left { background: linear-gradient(90deg, transparent, var(--gold)); }
    .rune-line.right { background: linear-gradient(90deg, var(--gold), transparent); }
    @keyframes expandLine { from { width: 0px; opacity: 0; } to { width: 80px; opacity: 1; } }

    @keyframes textFadeUp { from { opacity: 0; transform: translateY(30px); filter: blur(4px); } to { opacity: 1; transform: translateY(0); filter: blur(0px); } }
    .hero-sub { font-family: 'Cinzel', serif; font-size: clamp(14px, 2vw, 20px); font-weight: 400; color: var(--gold); letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 32px; opacity: 0; animation: textFadeUp 0.8s ease-out 3.3s forwards; }
    h1 { font-family: 'Cinzel', serif; font-size: clamp(42px, 7vw, 88px); font-weight: 900; line-height: 1.05; letter-spacing: 0.04em; color: #fff; text-shadow: 0 0 60px rgba(200,151,42,0.25); margin-bottom: 8px; opacity: 0; animation: textFadeUp 0.8s ease-out 3.5s forwards; }
    .hero-desc { font-size: 18px; font-style: italic; color: var(--muted); max-width: 560px; line-height: 1.8; margin-bottom: 52px; opacity: 0; animation: textFadeUp 0.8s ease-out 3.7s forwards; }
    
    @keyframes buttonShine { 0% { left: -100%; } 20%, 100% { left: 200%; } }
    .hero-cta { display: inline-flex; align-items: center; gap: 10px; padding: 14px 36px; border: 1px solid rgba(200,151,42,0.5); color: var(--gold); font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; transition: all 0.3s; position: relative; overflow: hidden; opacity: 0; animation: textFadeUp 0.8s ease-out 3.9s forwards; }
    .hero-cta::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(200,151,42,0.4), transparent); transform: skewX(-25deg); animation: buttonShine 4s infinite; }
    .hero-cta:hover { border-color: var(--gold); color: var(--gold2); background: rgba(200,151,42,0.07); box-shadow: 0 0 20px rgba(200,151,42,0.2); }

    @keyframes hintFadeUp { from { opacity: 0; transform: translateX(-50%) translateY(30px); filter: blur(4px); } to { opacity: 1; transform: translateX(-50%) translateY(0); filter: blur(0px); } }
    .scroll-hint { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; animation: hintFadeUp 0.8s ease-out 4.2s forwards, floatY 2.5s ease-in-out infinite 5.0s; }
    .scroll-line { width: 1px; height: 40px; background: linear-gradient(var(--gold), transparent); }
    @keyframes floatY { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(6px)} }

    /* SES KONTROL BUTONLARI */
    .controls-wrapper {
      position: fixed; bottom: 30px; right: 30px; z-index: 1000;
      display: flex; flex-direction: column; gap: 10px;
    }

    .audio-btn {
      background: rgba(6, 8, 15, 0.85); backdrop-filter: blur(10px);
      border: 1px solid rgba(200, 151, 42, 0.3); color: var(--gold);
      font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.1em;
      padding: 10px 20px; border-radius: 50px; cursor: pointer;
      display: flex; align-items: center; gap: 8px; text-transform: uppercase;
      transition: all 0.3s ease; opacity: 0; animation: hintFadeUp 0.8s ease-out 4.5s forwards;
    }
    
    .audio-btn:hover { background: rgba(200, 151, 42, 0.15); border-color: var(--gold); }
    .audio-btn.active { border-color: var(--gold2); color: #fff; box-shadow: 0 0 15px rgba(200, 151, 42, 0.2); }

    /* FİLTRE VE BÖLÜM TASARIMLARI */
    .controls-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 40px; opacity: 0; animation: textFadeUp 0.8s ease-out 0.5s forwards; }
    .control-box { display: flex; align-items: center; gap: 12px; background: rgba(11, 16, 32, 0.6); padding: 8px 16px; border: 1px solid rgba(200, 151, 42, 0.2); border-radius: 4px; transition: border-color 0.3s, box-shadow 0.3s; }
    .control-box:hover { border-color: rgba(200, 151, 42, 0.6); box-shadow: 0 0 15px rgba(200, 151, 42, 0.1); }
    .control-box label { font-family: 'Cinzel', serif; font-size: 12px; color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; }
    .control-box select { background: transparent; color: #fff; border: none; font-family: 'Crimson Pro', serif; font-size: 16px; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; -moz-appearance: none; padding-right: 10px; }
    .control-box select option { background: var(--bg); color: var(--text); }
    
    .section-wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 48px; }
    .section-title { text-align: center; padding: 80px 0 30px; }
    .section-eyebrow { font-family: 'Cinzel', serif; font-size: 11px; color: var(--gold); letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 16px; }
    .section-title h2 { font-family: 'Cinzel', serif; font-size: clamp(28px, 4vw, 44px); font-weight: 900; color: #fff; letter-spacing: 0.04em; }
    .gold-rule { width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 20px auto 0; }

    /* RUNETERRA RENK DEĞİŞKENLERİ */
    .demacia    { --rc:#4a9eff; --rb:rgba(74,158,255,0.12);  --rbo:rgba(74,158,255,0.4); }
    .noxus      { --rc:#cc3333; --rb:rgba(204,51,51,0.12);   --rbo:rgba(204,51,51,0.4); }
    .ionia      { --rc:#c87eff; --rb:rgba(200,126,255,0.12); --rbo:rgba(200,126,255,0.4); }
    .piltover   { --rc:#f0a020; --rb:rgba(240,160,32,0.12);  --rbo:rgba(240,160,32,0.4); }
    .freljord   { --rc:#7bcfff; --rb:rgba(123,207,255,0.12); --rbo:rgba(123,207,255,0.4); }
    .shadow     { --rc:#15c9b1; --rb:rgba(21,201,177,0.12);  --rbo:rgba(21,201,177,0.4); }
    .zaun       { --rc:#2de370; --rb:rgba(45,227,112,0.12);  --rbo:rgba(45,227,112,0.4); }
    .bilgewater { --rc:#c84b31; --rb:rgba(200,75,49,0.12);   --rbo:rgba(200,75,49,0.4); }
    .shurima    { --rc:#e6c229; --rb:rgba(230,194,41,0.12);  --rbo:rgba(230,194,41,0.4); }
    .targon     { --rc:#7b68ee; --rb:rgba(123,104,238,0.12); --rbo:rgba(123,104,238,0.4); }
    .void       { --rc:#b959ff; --rb:rgba(185,89,255,0.12);  --rbo:rgba(185,89,255,0.4); }
    .bandle     { --rc:#4caf50; --rb:rgba(76,175,80,0.12);   --rbo:rgba(76,175,80,0.4); }
    .ixtal      { --rc:#00c853; --rb:rgba(0,200,83,0.12);    --rbo:rgba(0,200,83,0.4); }

    /* HİKAYE KARTLARI CSS */
    #hikayeler { padding-bottom: 100px; }
    .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .story-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.4s, box-shadow 0.4s; }
    .story-card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--rbo); box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px var(--rb); }
    .card-region-bar { height: 3px; width: 100%; transition: height 0.3s; background: var(--rc); }
    .story-card:hover .card-region-bar { height: 5px; }
    .card-body { padding: 28px; }
    .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-content-flex { display: flex; align-items: flex-start; margin-bottom: 20px; position: relative; }
    .img-container { width: 0px; opacity: 0; overflow: hidden; transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s; flex-shrink: 0; }
    .story-card:hover .img-container { width: 86px; opacity: 1; }
    .card-hover-img { width: 72px; height: 72px; border-radius: 8px; object-fit: cover; margin-right: 14px; transform: scale(0.8) translateX(-20px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid var(--rc); box-shadow: 0 0 15px var(--rb); }
    .story-card:hover .card-hover-img { transform: scale(1) translateX(0); }
    .card-text-wrapper { flex-grow: 1; width: 100%; }
    .card-title-container { display: grid; margin-bottom: 8px; }
    .card-title-container > div { grid-area: 1 / 1; font-family: 'Cinzel', serif; font-size: 18px; font-weight: 900; line-height: 1.3; letter-spacing: 0.05em; transition: opacity 0.4s ease, transform 0.4s ease; }
    .title-name { color: #fff; opacity: 1; transform: translateY(0); }
    .title-epic { color: var(--rc); opacity: 0; transform: translateY(10px); pointer-events: none; text-shadow: 0 0 12px var(--rb); }
    .story-card:hover .title-name { opacity: 0; transform: translateY(-10px); }
    .story-card:hover .title-epic { opacity: 1; transform: translateY(0); }
    .card-region { color: var(--rc); background: var(--rb); border-color: var(--rbo); font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; padding: 4px 10px; border-radius: 2px; border: 1px solid; }
    .card-date { font-size: 13px; color: var(--muted); font-style: italic; }
    .card-excerpt { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 0; font-style: italic; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 72px; }
    .card-link { font-family: 'Cinzel', serif; font-size: 11px; color: var(--gold); letter-spacing: 0.15em; text-transform: uppercase; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: gap 0.2s, color 0.3s; margin-top: 15px; }
    .story-card:hover .card-link { gap: 14px; color: var(--rc); }

    /* HAKKINDA BÖLÜMÜ */
    #hakkinda { padding-bottom: 100px; }
    .about-box { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 56px; display: grid; grid-template-columns: 1fr 2fr; gap: 56px; align-items: start; }
    .about-left { text-align: center; }
    @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .avatar-ring { position: relative; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(200,151,42,0.4); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 48px; background: rgba(200,151,42,0.05); box-shadow: 0 0 40px rgba(200,151,42,0.1); }
    .avatar-ring::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px dashed rgba(200,151,42,0.5); animation: spinRing 15s linear infinite; }
    .about-name { font-family: 'Cinzel', serif; font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .about-title-small { font-size: 14px; color: var(--gold); font-style: italic; }
    .about-right h3 { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 20px; }
    .about-right p { font-size: 17px; color: var(--muted); margin-bottom: 16px; line-height: 1.85; }
    .regions-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .region-badge { font-family: 'Cinzel', serif; font-size: 11px; padding: 6px 14px; border-radius: 2px; border: 1px solid var(--rbo, rgba(200,151,42,0.3)); color: var(--rc, var(--gold)); background: var(--rb, rgba(200,151,42,0.06)); letter-spacing: 0.1em; transition: all 0.3s; }
    .region-badge:hover { transform: translateY(-2px); box-shadow: 0 4px 10px var(--rb, rgba(200,151,42,0.15)); filter: brightness(1.2); }

    /* SİNEMATİK GEÇİŞ ARAYÜZÜ */
    #page-transition-overlay { position: fixed; inset: 0; z-index: 9999999; pointer-events: none; visibility: hidden; display: flex; justify-content: center; align-items: center; }
    .transition-splash { position: absolute; inset: 0; background-position: center top; background-size: cover; background-repeat: no-repeat; opacity: 0; transform: scale(1.1); transition: opacity 0.8s ease-out, transform 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    .transition-blackout { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity 0.8s ease-in-out; }
    #page-transition-overlay.active { visibility: visible; pointer-events: all; }
    #page-transition-overlay.active .transition-splash { opacity: 1; transform: scale(1); }
    #page-transition-overlay.active.blackout .transition-blackout { opacity: 1; }

    footer { position: relative; z-index: 1; border-top: 1px solid rgba(200,151,42,0.12); padding: 48px 56px; text-align: center; }
    .footer-logo { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 900; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 12px; }
    .footer-quote { font-style: italic; color: var(--muted); font-size: 15px; margin-bottom: 24px; }
    .footer-copy { font-family: 'Cinzel', serif; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
    .fade-in { opacity: 0; transform: translateY(35px); transition: opacity 0.8s cubic-bezier(0.165, 0.84, 0.44, 1), transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1); }
    .fade-in.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div style="position: fixed; bottom: 0; right: 0; width: 200px; height: 200px; opacity: 0; pointer-events: none; z-index: -99;">
    <div id="youtube-player"></div>
  </div>
  <audio id="hover-sound" preload="auto">
    <source src="lol-hover.mp3" type="audio/mpeg">
  </audio>

  <div class="controls-wrapper">
    <button id="music-toggle" class="audio-btn" aria-label="Müziği Aç/Kapat">
      <span class="music-icon">🔇</span> <span class="music-text">Müzik</span>
    </button>
    <button id="sfx-toggle" class="audio-btn active" aria-label="Efektleri Aç/Kapat">
      <span class="sfx-icon">🔊</span> <span class="sfx-text">Efektler</span>
    </button>
  </div>

  <div id="scroll-lock"></div>
  <div id="page-transition-overlay">
    <div class="transition-splash" id="transition-splash"></div>
    <div class="transition-blackout" id="transition-blackout"></div>
  </div>

  <nav>
    <div class="logo">Runeterra <span>Günlükleri</span></div>
    <ul>
      <li><a href="#hikayeler">Efsaneler</a></li>
      <li><a href="#hakkinda">Hakkında</a></li>
    </ul>
  </nav>

  <section id="hero">
    <div class="rune-divider"><span class="rune-line left"></span><span class="rune-icon">✦</span><span class="rune-line right"></span></div>
    <p class="hero-sub">Runeterra Günlükleri</p>
    <h1>Efsaneler<br>Yaşıyor</h1>
    <p class="hero-desc">Demacia'nın surlarından Noxus'un kan kırmızısı topraklarına, Ionia'nın sisli ormanlarından Freljord'un dondurucu tundrasına — hikayeler burada yaşıyor.</p>
    <a href="#hikayeler" class="hero-cta">Keşfet ✦</a>
    <div class="scroll-hint"><div class="scroll-line"></div>Aşağı Kaydır</div>
  </section>

  <section id="hikayeler">
    <div class="section-wrap">
      <div class="section-title fade-in"><div class="section-eyebrow">✦ Arşiv ✦</div><h2>Efsaneler</h2><div class="gold-rule"></div></div>
      <div class="controls-container fade-in">
        <div class="control-box">
          <label for="filter-region">Bölge Seç:</label>
          <select id="filter-region">
            <option value="all">Tüm Bölgeler</option>
            <option value="freljord">Freljord</option>
            <option value="demacia">Demacia</option>
            <option value="noxus">Noxus</option>
            <option value="ionia">Ionia</option>
            <option value="zaun">Zaun</option>
            <option value="piltover">Piltover</option>
            <option value="bilgewater">Bilgewater</option>
            <option value="shurima">Shurima</option>
            <option value="targon">Targon</option>
            <option value="shadow">Shadow Isles</option>
            <option value="void">Hiçlik</option>
            <option value="bandle">Bandle City</option>
            <option value="ixtal">Ixtal</option>
          </select>
        </div>
        <div class="control-box">
          <label for="sort-order">Sırala:</label>
          <select id="sort-order">
            <option value="default">En Yeni Eklenenler</option>
            <option value="name-asc">İsme Göre (A-Z)</option>
            <option value="name-desc">İsme Göre (Z-A)</option>
            <option value="region">Bölgeye Göre</option>
          </select>
        </div>
      </div>
      <div class="stories-grid" id="main-grid"></div>
    </div>
  </section>

  <script>
    /* -------------------------------------------------------------------------
       1. VERİ VE RENDER SİSTEMİ
       ------------------------------------------------------------------------- */
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(el => { if (el.isIntersecting) el.target.classList.add('visible'); });
    }, { threshold: 0.08 });

    const championsData = [
      { id: "Volibear", name: "Volibear", epic: "Fırtınanın Pençeleri", regionClass: "freljord", regionDisplay: "Freljord", date: "15 Mayıs 2026", excerpt: "Kuzeyin dondurucu rüzgarları sadece soğuk getirmiyordu; yaklaşan fırtınanın habercisiydi..." },
      { id: "Garen", name: "Garen", epic: "Demacia'nın Kudreti", regionClass: "demacia", regionDisplay: "Demacia", date: "10 Mayıs 2026", excerpt: "Demacia'nın görkemli surları, ancak onları koruyan yürekler kadar güçlüdür." },
      { id: "Darius", name: "Darius", epic: "Noxus'un Eli", regionClass: "noxus", regionDisplay: "Noxus", date: "02 Mayıs 2026", excerpt: "Güç, kimin haklı kimin haksız olduğunu belirleyen tek gerçekti." },
      { id: "Yasuo", name: "Yasuo", epic: "Günahkâr Kılıç", regionClass: "ionia", regionDisplay: "Ionia", date: "28 Nisan 2026", excerpt: "Affedilmek, sadece suçunu kabul edenler içindir." },
      { id: "Jinx", name: "Jinx", epic: "Deliliğin Silahşoru", regionClass: "zaun", regionDisplay: "Zaun", date: "25 Nisan 2026", excerpt: "Kurallar yıkılmak, binalar ise patlatılmak içindir!" },
      { id: "Thresh", name: "Thresh", epic: "Zincirli Gardiyan", regionClass: "shadow", regionDisplay: "Shadow Isles", date: "20 Nisan 2026", excerpt: "\"Huzur mu? Ne sıkıcı.\"" },
      { id: "MissFortune", name: "Miss Fortune", epic: "Ödül Avcısı", regionClass: "bilgewater", regionDisplay: "Bilgewater", date: "16 Nisan 2026", excerpt: "Bilgewater'ın tehlikeli sularında güvenebileceğin tek şey tabancalarındır." },
      { id: "Azir", name: "Azir", epic: "Kumların İmparatoru", regionClass: "shurima", regionDisplay: "Shurima", date: "11 Nisan 2026", excerpt: "Binlerce yıllık uykusundan uyanan Shurima, güneşin altında yükselecek." },
      { id: "Pantheon", name: "Pantheon", epic: "Eğilmez Mızrak", regionClass: "targon", regionDisplay: "Targon", date: "07 Nisan 2026", excerpt: "İlahların gücü bile bir ölümlünün iradesi karşısında boyun eğebilir." },
      { id: "Kaisa", name: "Kai'Sa", epic: "Hiçliğin Kızı", regionClass: "void", regionDisplay: "Hiçlik", date: "01 Nisan 2026", excerpt: "Canavarların arasında hayatta kalmak için onlardan biri olmalısın." },
      { id: "Vi", name: "Vi", epic: "Piltover Fedaisi", regionClass: "piltover", regionDisplay: "Piltover", date: "28 Mart 2026", excerpt: "Sorunları çözmenin pek çok yolu vardır ama Vi için en etkilisi yumruklardır." },
      { id: "Ashe", name: "Ashe", epic: "Ayaz Okçusu", regionClass: "freljord", regionDisplay: "Freljord", date: "23 Mart 2026", excerpt: "Gerçek bir kabile annesi savaşmak için değil, barışı korumak için yayını gerer." },
      { id: "Lux", name: "Lux", epic: "Işığın Leydisi", regionClass: "demacia", regionDisplay: "Demacia", date: "17 Mart 2026", excerpt: "Büyünün nefretle karşılandığı bir şehirde, içindeki gücü saklamak en büyük savaştır." },
      { id: "Warwick", name: "Warwick", epic: "Zaun'un Öfkesi", regionClass: "zaun", regionDisplay: "Zaun", date: "12 Mart 2026", excerpt: "Kimyasal sızıntıların ortasında, kanın kokusu her şeyden keskindir." },
      { id: "Swain", name: "Swain", epic: "Büyük General", regionClass: "noxus", regionDisplay: "Noxus", date: "08 Mart 2026", excerpt: "Savaş meydanında kan dökülmeden çok önce, zafer satranç masasında kazanılır." },
      { id: "Pyke", name: "Pyke", epic: "Kanlı Liman'ın Öcü", regionClass: "bilgewater", regionDisplay: "Bilgewater", date: "03 Mart 2026", excerpt: "Derinlerin karanlığından gelen bir fısıltı..." },
      { id: "Ahri", name: "Ahri", epic: "Dokuz Kuyruklu Tilki", regionClass: "ionia", regionDisplay: "Ionia", date: "26 Şubat 2026", excerpt: "Güzellik, ardında saklanan tehlikeyi maskelemek için kusursuz bir silahtır." },
      { id: "Nasus", name: "Nasus", epic: "Kumların Muhafızı", regionClass: "shurima", regionDisplay: "Shurima", date: "19 Şubat 2026", excerpt: "Zaman, ölümlüler için bir düşman olabilir ama Yükseliş'e ermiş biri için bir araçtır." },
      { id: "Jayce", name: "Jayce", epic: "Yarınların Koruyucusu", regionClass: "piltover", regionDisplay: "Piltover", date: "14 Şubat 2026", excerpt: "Zeka ve gücün mükemmel birleşimi." },
      { id: "Diana", name: "Diana", epic: "Ayın Hiddeti", regionClass: "targon", regionDisplay: "Targon", date: "09 Şubat 2026", excerpt: "Diana, gümüş hilal kılıcıyla gerçeği aydınlatmaya yeminliydi." },
      { id: "Hecarim", name: "Hecarim", epic: "Savaşın Gölgesi", regionClass: "shadow", regionDisplay: "Shadow Isles", date: "05 Şubat 2026", excerpt: "\"Ölümün toynak seslerini duyuyor musunuz?\"" },
      { id: "Khazix", name: "Kha'Zix", epic: "Hiçlik Yağmacısı", regionClass: "void", regionDisplay: "Hiçlik", date: "30 Ocak 2026", excerpt: "Avlan, tüket ve evrim geçir." },
      { id: "Sejuani", name: "Sejuani", epic: "Kışın Gazabı", regionClass: "freljord", regionDisplay: "Freljord", date: "24 Ocak 2026", excerpt: "Kış Pençesi için hayatta kalmak yeterli değildi." },
      { id: "Sylas", name: "Sylas", epic: "İsyanın Zincirleri", regionClass: "demacia", regionDisplay: "Demacia", date: "18 Ocak 2026", excerpt: "Onu zincirlediklerini sandılar, oysa sadece silahını vermişlerdi." },
      { id: "Karma", name: "Karma", epic: "Aydınlanmış Olan", regionClass: "ionia", regionDisplay: "Ionia", date: "12 Ocak 2026", excerpt: "Barış bir hediye değil, her gün kazanılması gereken bir irade savaşıdır." },
      { id: "Caitlyn", name: "Caitlyn", epic: "Piltover Şerifi", regionClass: "piltover", regionDisplay: "Piltover", date: "07 Ocak 2026", excerpt: "Kaçmak sadece yakalanmayı geciktirirdi." },
      { id: "Viego", name: "Viego", epic: "Mahvolmuş Kral", regionClass: "shadow", regionDisplay: "Shadow Isles", date: "02 Ocak 2026", excerpt: "Aşk bazen zehirli bir kılıçtır." },
      { id: "JarvanIV", name: "Jarvan IV", epic: "Demacia'nın Örneği", regionClass: "demacia", regionDisplay: "Demacia", date: "26 Aralık 2025", excerpt: "Bir kral tahtta değil, ön saflarda belli olur." },
      { id: "Zed", name: "Zed", epic: "Gölgelerin Efendisi", regionClass: "ionia", regionDisplay: "Ionia", date: "19 Aralık 2025", excerpt: "Zayıflık, geleneğe körü körüne bağlılıktan doğar." },
      { id: "Katarina", name: "Katarina", epic: "Uğursuz Bıçak", regionClass: "noxus", regionDisplay: "Noxus", date: "10 Aralık 2025", excerpt: "Kararlarında tereddüt edenler savaş alanında kanamaya mahkumdur." }
    ];

    function triggerCinematicTransition(e, pageLink, championId) {
      e.preventDefault();
      const overlay = document.getElementById('page-transition-overlay');
      const splash = document.getElementById('transition-splash');
      splash.style.backgroundImage = `url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${championId}_0.jpg')`;
      overlay.classList.add('active');
      setTimeout(() => {
        overlay.classList.add('blackout');
        setTimeout(() => window.location.href = pageLink, 800);
      }, 1200);
    }

    const grid = document.getElementById('main-grid');
    function renderChampions() {
      grid.innerHTML = '';
      championsData.forEach((champ, index) => {
        const card = document.createElement('div');
        const pageLink = champ.id.toLowerCase() + '.html';
        card.className = `story-card ${champ.regionClass} fade-in`;
        card.dataset.index = index;
        card.innerHTML = `
          <div class="card-region-bar"></div>
          <div class="card-body">
            <div class="card-meta"><span class="card-region">${champ.regionDisplay}</span><span class="card-date">${champ.date}</span></div>
            <div class="card-content-flex">
              <div class="img-container"><img class="card-hover-img" src="https://ddragon.leagueoflegends.com/cdn/14.8.1/img/champion/${champ.id}.png" loading="lazy"></div>
              <div class="card-text-wrapper">
                <div class="card-title-container"><div class="title-name">${champ.name}</div><div class="title-epic">${champ.epic}</div></div>
                <p class="card-excerpt">${champ.excerpt}</p>
              </div>
            </div>
            <a href="${pageLink}" class="card-link">Okumaya Devam Et →</a>
          </div>`;

        card.addEventListener('click', (e) => { if(!e.target.classList.contains('card-link')) triggerCinematicTransition(e, pageLink, champ.id); });
        card.querySelector('.card-link').addEventListener('click', (e) => triggerCinematicTransition(e, pageLink, champ.id));

        // SFX: Kartın Üzerine Gelince (Efektler açıksa)
        card.addEventListener('mouseenter', () => {
          if (isSfxEnabled && hoverSound) {
            hoverSound.pause();
            hoverSound.currentTime = 2.5; // İstediğin 2.5 saniyesi
            hoverSound.play().catch(() => {});
          }
        });
        grid.appendChild(card);
      });
      document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    }
    renderChampions();

    /* -------------------------------------------------------------------------
       2. SES KONTROLLERİ (SES SEVİYELERİ DÜŞÜRÜLDÜ)
       ------------------------------------------------------------------------- */
    let ytPlayer;
    let isMusicPlaying = false;
    let isSfxEnabled = true;

    const musicBtn = document.getElementById('music-toggle');
    const sfxBtn = document.getElementById('sfx-toggle');
    const hoverSound = document.getElementById('hover-sound');

    // YouTube API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('youtube-player', {
        height: '200', width: '200', videoId: 'aPf9EcHbWHE',
        playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'start': 2 },
        events: {
          'onReady': (event) => {
             event.target.setVolume(10); // MÜZİK SESİ %10'A DÜŞÜRÜLDÜ
          }
        }
      });
    };

    musicBtn.addEventListener('click', () => {
      if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
      if (!isMusicPlaying) {
        ytPlayer.playVideo();
        musicBtn.innerHTML = '<span>🔊</span> <span>Müzik</span>';
        musicBtn.classList.add('active');
        isMusicPlaying = true;
      } else {
        ytPlayer.pauseVideo();
        musicBtn.innerHTML = '<span>🔇</span> <span>Müzik</span>';
        musicBtn.classList.remove('active');
        isMusicPlaying = false;
      }
    });

    sfxBtn.addEventListener('click', () => {
      if (isSfxEnabled) {
        isSfxEnabled = false;
        sfxBtn.innerHTML = '<span>🔇</span> <span>Efektler</span>';
        sfxBtn.classList.remove('active');
      } else {
        isSfxEnabled = true;
        sfxBtn.innerHTML = '<span>🔊</span> <span>Efektler</span>';
        sfxBtn.classList.add('active');
      }
    });

    // Hover Efekt Ses Ayarı
    hoverSound.volume = 0.15; // EFEKT SESİ %15'E DÜŞÜRÜLDÜ
    hoverSound.addEventListener('timeupdate', function() {
      if (this.currentTime >= 9.0) this.pause(); // 9.0 sn'de durdur
    });

    /* -------------------------------------------------------------------------
       3. FİLTRELEME
       ------------------------------------------------------------------------- */
    const filterSelect = document.getElementById('filter-region');
    const sortSelect = document.getElementById('sort-order');
    function updateGrid() {
      const cards = Array.from(grid.querySelectorAll('.story-card'));
      const filterValue = filterSelect.value;
      const sortValue = sortSelect.value;
      cards.forEach(card => {
        if (filterValue === 'all' || card.classList.contains(filterValue)) card.style.display = 'block';
        else card.style.display = 'none';
      });
      let visibleCards = cards.filter(card => card.style.display === 'block');
      visibleCards.sort((a, b) => {
        if (sortValue === 'name-asc') return a.querySelector('.title-name').textContent.localeCompare(b.querySelector('.title-name').textContent, 'tr');
        else if (sortValue === 'name-desc') return b.querySelector('.title-name').textContent.localeCompare(a.querySelector('.title-name').textContent, 'tr');
        else if (sortValue === 'region') return a.querySelector('.card-region').textContent.localeCompare(b.querySelector('.card-region').textContent, 'tr');
        else return a.dataset.index - b.dataset.index;
      });
      visibleCards.forEach((card, index) => card.style.order = index);
    }
    filterSelect.addEventListener('change', updateGrid);
    sortSelect.addEventListener('change', updateGrid);
  </script>
</body>
</html>
