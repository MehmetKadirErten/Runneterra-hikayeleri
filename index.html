<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runeterra Günlükleri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06080f; --bg2: #090d18; --card: #0b1020; --border: #1a2035;
      --gold: #c8972a; --gold2: #e8c060; --blue: #4a9eff; --text: #d4c9b8; --muted: #6a7080;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Crimson Pro', serif; font-size: 18px; line-height: 1.8; overflow-x: hidden; margin: 0; }

    #scroll-lock { position: fixed; inset: 0; z-index: 999999; animation: removeLock 0s linear 4.5s forwards; }
    @keyframes removeLock { to { visibility: hidden; pointer-events: none; } }

    @keyframes ambientGlow { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 20% 0%, rgba(74,158,255,0.05) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(200,151,42,0.07) 0%, transparent 60%); pointer-events: none; z-index: 0; animation: ambientGlow 10s ease-in-out infinite; }

    /* NAV MENÜSÜ */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 20px 56px; background: rgba(6,8,15,0.92); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(200,151,42,0.15); }
    .logo { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 900; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; }
    .logo span { color: var(--text); font-weight: 400; }
    nav ul { display: flex; gap: 36px; list-style: none; }
    nav a { font-family: 'Cinzel', serif; font-size: 11px; color: var(--muted); text-decoration: none; letter-spacing: 0.15em; text-transform: uppercase; transition: color 0.25s; }
    nav a:hover { color: var(--gold); }

    /* HERO */
    #hero { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 120px 40px 80px; }
    h1 { font-family: 'Cinzel', serif; font-size: clamp(42px, 7vw, 88px); font-weight: 900; color: #fff; margin-bottom: 30px; }
    .hero-cta { padding: 14px 36px; border: 1px solid rgba(200,151,42,0.5); color: var(--gold); text-decoration: none; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }

    /* SES KONTROLLERİ */
    .controls-wrapper { position: fixed; bottom: 30px; right: 30px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .audio-btn { background: rgba(6, 8, 15, 0.85); border: 1px solid rgba(200, 151, 42, 0.3); color: var(--gold); padding: 10px 20px; border-radius: 50px; cursor: pointer; font-family: 'Cinzel', serif; font-size: 10px; text-transform: uppercase; }
    .audio-btn.active { border-color: var(--gold2); color: #fff; box-shadow: 0 0 15px rgba(200, 151, 42, 0.2); }

    /* KART GRID SİSTEMİ */
    .section-wrap { max-width: 1080px; margin: 0 auto; padding: 48px; }
    .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .story-card { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.4s; }
    .story-card:hover { transform: translateY(-8px); border-color: var(--gold); }
    .card-body { padding: 28px; }
    .card-title-container { font-family: 'Cinzel', serif; font-size: 18px; color: #fff; margin-bottom: 8px; }
    .card-excerpt { font-size: 15px; color: var(--muted); font-style: italic; }
    .card-link { color: var(--gold); text-decoration: none; font-size: 11px; margin-top: 15px; display: block; }

    /* SİNEMATİK GEÇİŞ SİSTEMİ */
    #page-transition-overlay { position: fixed; inset: 0; z-index: 9999999; pointer-events: none; visibility: hidden; display: flex; justify-content: center; align-items: center; }
    .transition-splash { position: absolute; inset: 0; background-position: center top; background-size: cover; background-repeat: no-repeat; opacity: 0; transform: scale(1.15) translateY(20px); transition: opacity 0.7s, transform 3s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
    
    /* VOLIBEAR SİYAH BEYAZ SİLÜET */
    .transition-splash.lightning-flash { 
      opacity: 1 !important; 
      filter: grayscale(1) brightness(10) contrast(500%) !important; 
      transform: scale(1.05) !important;
      transition: none !important; 
    }
    
    #page-transition-overlay.active { visibility: visible; pointer-events: all; }
    #page-transition-overlay.active .transition-splash { opacity: 1; transform: scale(1) translateY(0); }
    .transition-blackout { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity 1s; }
    #page-transition-overlay.active.blackout .transition-blackout { opacity: 1; }

    footer { border-top: 1px solid rgba(200,151,42,0.12); padding: 48px 56px; text-align: center; }
    .footer-logo { font-family: 'Cinzel', serif; font-size: 20px; font-weight: 900; color: var(--gold); }
    .fade-in { opacity: 0; transform: translateY(35px); transition: 0.8s all; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div id="youtube-player" style="position:fixed; visibility:hidden;"></div>
  <audio id="hover-sound" preload="auto"><source src="lol-hover.mp3" type="audio/mpeg"></audio>
  <audio id="volibear-voice" preload="auto"><source src="volibear-voice.mp3" type="audio/mpeg"></audio>
  <audio id="lightning-sfx" preload="auto"><source src="lightning.mp3" type="audio/mpeg"></audio>

  <div class="controls-wrapper">
    <button id="music-toggle" class="audio-btn"><span>🔇</span> Müzik</button>
    <button id="sfx-toggle" class="audio-btn active"><span>🔊</span> Efektler</button>
  </div>

  <div id="page-transition-overlay">
    <div class="transition-splash" id="transition-splash"></div>
    <div class="transition-blackout" id="transition-blackout"></div>
  </div>

  <nav>
    <div class="logo">Runeterra <span>Günlükleri</span></div>
    <ul><li><a href="#hikayeler">Efsaneler</a></li><li><a href="#hakkinda">Hakkında</a></li></ul>
  </nav>

  <section id="hero">
    <h1>Efsaneler Yaşıyor</h1>
    <a href="#hikayeler" class="hero-cta">Keşfet</a>
  </section>

  <section id="hikayeler" class="section-wrap">
    <div class="stories-grid" id="main-grid"></div>
  </section>

  <script>
    /* 1. ŞAMPİYON VERİLERİ */
    const championsData = [
      { id: "Volibear", name: "Volibear", excerpt: "Kuzeyin dondurucu rüzgarları sadece soğuk getirmiyordu; fırtına uyanıyordu..." },
      { id: "Garen", name: "Garen", excerpt: "Demacia'nın sarsılmaz kalkanı her türlü karanlığa karşı göğüs gerer." },
      { id: "Darius", name: "Darius", excerpt: "Noxus'un gerçek gücü, elindeki baltadan değil, yüreğindeki azimden gelir." }
    ];

    /* 2. SİNEMATİK GEÇİŞ (VOLIBEAR ÖZEL) */
    function triggerCinematicTransition(e, pageLink, championId) {
      e.preventDefault();
      const overlay = document.getElementById('page-transition-overlay');
      const splash = document.getElementById('transition-splash');
      const voice = document.getElementById('volibear-voice');
      const lightning = document.getElementById('lightning-sfx');

      splash.style.backgroundImage = `url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${championId}_0.jpg')`;
      overlay.classList.add('active');

      if (championId === 'Volibear') {
        // SES DÜZELTMESİ: Replik tıklandığı an başlar ve sesi %80 yaptık
        if(isSfxEnabled) {
          voice.volume = 0.8;
          voice.currentTime = 0;
          voice.play();
        }

        // 1.0s: Ekran kararmaya başlar
        setTimeout(() => overlay.classList.add('blackout'), 1000);

        // 2.0s: İLK YILDIRIM (Silüet patlar)
        setTimeout(() => {
          if(isSfxEnabled) { lightning.currentTime = 0; lightning.play(); }
          splash.classList.add('lightning-flash');
          setTimeout(() => splash.classList.remove('lightning-flash'), 200);
        }, 2000);

        // 4.5s: İKİNCİ YILDIRIM (Süreyi arttırdık - Arada 2.5 saniye var)
        setTimeout(() => {
          if(isSfxEnabled) { lightning.currentTime = 0; lightning.play(); }
          splash.classList.add('lightning-flash');
          setTimeout(() => splash.classList.remove('lightning-flash'), 200);
        }, 4500);

        // 6.5s: Yönlendirme
        setTimeout(() => window.location.href = pageLink, 6500);

      } else {
        // Diğer şampiyonlar için standart geçiş
        setTimeout(() => overlay.classList.add('blackout'), 1000);
        setTimeout(() => window.location.href = pageLink, 1800);
      }
    }

    /* 3. KARTLARI ÇİZME */
    const grid = document.getElementById('main-grid');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(el => { if (el.isIntersecting) el.target.classList.add('visible'); });
    }, { threshold: 0.1 });

    function render() {
      grid.innerHTML = '';
      championsData.forEach(champ => {
        const card = document.createElement('div');
        card.className = `story-card fade-in`;
        card.innerHTML = `
          <div class="card-body">
            <div class="card-title-container">${champ.name}</div>
            <p class="card-excerpt">${champ.excerpt}</p>
            <a href="${champ.id.toLowerCase()}.html" class="card-link">Okumaya Devam Et →</a>
          </div>`;
        
        card.addEventListener('click', (e) => triggerCinematicTransition(e, `${champ.id.toLowerCase()}.html`, champ.id));
        card.addEventListener('mouseenter', () => playHoverSound());
        
        grid.appendChild(card);
        observer.observe(card);
      });
    }
    render();

    /* 4. SES SİSTEMİ (%10 Müzik, %15 Hover) */
    let ytPlayer, isMusicPlaying = false, isSfxEnabled = true;
    const hoverSound = document.getElementById('hover-sound');
    
    function playHoverSound() {
      if (isSfxEnabled && hoverSound) {
        hoverSound.pause();
        hoverSound.currentTime = 2.5; 
        hoverSound.play().catch(()=>{});
      }
    }
    hoverSound.volume = 0.15;
    hoverSound.addEventListener('timeupdate', function() { if (this.currentTime >= 9.0) this.pause(); });

    // YouTube API
    const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('youtube-player', {
        height: '0', width: '0', videoId: 'aPf9EcHbWHE',
        playerVars: { 'autoplay': 0, 'controls': 0, 'start': 2 },
        events: { 'onReady': (e) => e.target.setVolume(10) }
      });
    };

    document.getElementById('music-toggle').onclick = function() {
      if (!ytPlayer) return;
      if (!isMusicPlaying) {
        ytPlayer.playVideo(); this.innerHTML = '🔊 Müzik'; this.classList.add('active'); isMusicPlaying = true;
      } else {
        ytPlayer.pauseVideo(); this.innerHTML = '🔇 Müzik'; this.classList.remove('active'); isMusicPlaying = false;
      }
    };

    document.getElementById('sfx-toggle').onclick = function() {
      isSfxEnabled = !isSfxEnabled;
      this.innerHTML = isSfxEnabled ? '🔊 Efektler' : '🔇 Efektler';
      this.classList.toggle('active');
    };
  </script>
</body>
</html>
